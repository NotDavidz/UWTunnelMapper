<!DOCTYPE html>

<html lang="en" dir="ltr">
<head>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UW Tunnel Map</title>
    <link rel="stylesheet" href="style.css">

    
</head>
<body>
    <!-- Display Map --> 
    <div id="map-container">
        <svg id="subway-map"></svg>
    </div>
    
    <script src="script.js"></script>
   
    <!-- Input Box --> 
    <div id="field_prompt_parent">
        <!-- Main Text --> 
        <p id="main_subtext">UW Tunnel System Map</p>
        <p id="prompt"> Start: </p>
        <p id="prompt"> Destination: </p>
        <input id = "start_txtfield" onchange="updateFieldColor()" placeholder = "..."> </input>
        <input id = "end_txtfield" onchange="updateFieldColor()" placeholder = "..."> </input>
        <button  disabled = true id = "calculate" onclick="calculatePath()"><span>Find Path</span></button>
        <!-- Icon for Input-->
        <div id="prompt_icons">
            <p id="start_prompt_icon"></p>
            <p id="end_prompt_icon"></p>
        </div>
    </div>

    <!-- Text Field for Result --> 
    <div id="result_parent">
        <p id="output"></p>
    </div>


</body>
</html>
